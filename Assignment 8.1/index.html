<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <!-- Dashboard Header -->
        <header class="header">
            <h1>My Dashboard</h1>
            <p>Welcome, Admin!</p>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Menu</h2>
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Users</a>
                <a href="#">Products</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <h2>Overview</h2>

            <!-- Statistic Cards -->
            <section class="cards">

                <div class="card">
                    <h3>Total Users</h3>
                    <p>1,250</p>
                </div>

                <div class="card">
                    <h3>Total Revenue</h3>
                    <p>₹45,000</p>
                </div>

                <div class="card">
                    <h3>Total Orders</h3>
                    <p>320</p>
                </div>

                <div class="card">
                    <h3>Growth</h3>
                    <p>18%</p>
                </div>

            </section>
        </main>

    </div>

</body>
</html>
